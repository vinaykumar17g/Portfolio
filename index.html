        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
      }

        position: absolute;
        border-radius: 50%;
        filter: blur(90px);
        opacity: 0.45;
        animation: floatBlob 12s ease-in-out infinite alternate;
      }

        width: 420px;
        height: 420px;
        background: #0ea5e9;
        top: -80px;
        left: -80px;
      }

        width: 380px;
        height: 380px;
        background: #7c3aed;
        top: 30%;
        right: -100px;
        animation-delay: 2s;
      }

        width: 320px;
        height: 320px;
        background: #db2777;
        bottom: -100px;
        left: 30%;
        animation-delay: 4s;
      }

        from {

        }

          transform: translate(40px, 50px) scale(1.15);
        }

        transition: 0.3s;

      .badge {
        display: inline-block;
        background: #1e293b;
        border: 1px solid #334155;
        padding: 7px 13px;
        border-radius: 999px;
        font-size: 12px;
        color: var(--accent);
        margin-bottom: 16px;
        animation: bounceBadge 2s infinite;
      }

      .badge i {
        width: 8px;
        height: 8px;
        background: #22c55e;
        border-radius: 50%;
        display: inline-block;
        margin-right: 6px;
        animation: blink 1.2s infinite;
      }

      @keyframes bounceBadge {
        0%,
        100% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(-5px);
        }
      }

      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }

        50% {
          opacity: 0.3;
        }
      }

      .hero h1 {
        font-size: clamp(2.25rem, 6vw, 3.25rem);
        line-height: 1.05;
        margin-bottom: 12px;
        animation: fadeUp 0.8s ease;
      }

      .hero h1 span {
        background: linear-gradient(
          90deg,
          var(--accent),
          var(--accent2),
          var(--accent3)
        );
        background-size: 200% auto;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: gradientMove 4s linear infinite;
      }

      .typing {
        color: var(--accent);
        font-size: clamp(1.1rem, 3vw, 1.375rem);
        font-weight: 700;
        min-height: 32px;
        margin: 6px 0 10px;
      }

      .caret {
        animation: caret 0.8s infinite;
        margin-left: 2px;
      }

      @keyframes caret {
        0%,
        100% {
          opacity: 1;
        }

        50% {
          opacity: 0;
        }
      }

      .hero p {
        color: var(--muted);
        margin-bottom: 18px;
      }

      .hero-btns {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        animation: fadeUp 1s ease;
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .social-row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 22px;
      }

      .social-row a {
        width: 42px;
        height: 42px;
        border: 1px solid #334155;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: #1e293b;
        transition: 0.25s;
      }

      .social-row a:hover {
        color: var(--accent);
        border-color: var(--accent);
        transform: translateY(-3px);
      }

      .hero-card {
        background: linear-gradient(180deg, #1e293b, #0f172a);
        border: 1px solid #334155;
        border-radius: 22px;
        padding: 24px;
        text-align: center;
        animation: floatCard 4s ease-in-out infinite;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      }

      @keyframes floatCard {
        0%,
        100% {
          transform: translateY(0) rotate(-0.5deg);
        }

        50% {
          transform: translateY(-12px) rotate(0.5deg);
        }
      }

      .avatar {
        width: 110px;
        height: 110px;
        border-radius: 50%;
        background: linear-gradient(
          135deg,
          var(--accent),
          var(--accent2),
          var(--accent3)
        );
        background-size: 200% 200%;
        animation: gradientMove 3s linear infinite;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 42px;
        font-weight: 800;
        color: #fff;
        margin: 0 auto 14px;
        box-shadow:
          0 0 0 4px rgba(56, 189, 248, 0.2),
          0 0 30px rgba(56, 189, 248, 0.4);
      }

      .avatar img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        border-radius: inherit;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-top: 18px;
      }

      .stat {
        background: #0f172a;
        border: 1px solid #1e293b;
        border-radius: 12px;
        padding: 12px;
        transition: 0.3s;
      }

      .stat:hover {
        transform: scale(1.08);
        border-color: var(--accent);
      }

      .stat b {
        font-size: 22px;
        color: #fff;
        display: block;
      }

      .stat span {
        font-size: 12px;
        color: var(--muted);
      }

      .reveal {
        opacity: 0;
        transform: translateY(35px);
        transition: all 0.8s ease;
      }

      .reveal.visible,
      .reveal-left.visible,
      .reveal-right.visible {
        opacity: 1;
        transform: translateY(0) translateX(0);
      }

      .reveal-left {
        opacity: 0;
        transform: translateX(-40px);
        transition: all 0.8s ease;
      }

      .reveal-right {
        opacity: 0;
        transform: translateX(40px);
        transition: all 0.8s ease;
      }

      section {
        padding: 50px 0;
        position: relative;
        z-index: 1;
      }

      .section-title {
        font-size: clamp(1.8rem, 5vw, 2rem);
        margin-bottom: 6px;
      }

      .section-title span {
        color: var(--accent);
      }

      .section-sub {
        color: var(--muted);
        margin-bottom: 28px;
      }

      .card {
        background: var(--card);
        border: 1px solid #334155;
        border-radius: 16px;
        padding: 24px;
        transition: 0.35s;
        position: relative;
        overflow: hidden;
      }

      .card:hover {
        transform: translateY(-8px);
        border-color: var(--accent);
        box-shadow: 0 20px 40px rgba(56, 189, 248, 0.15);
      }

      .card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 3px;
        background: linear-gradient(
          90deg,
          var(--accent),
          var(--accent2),
          var(--accent3)
        );
        transform: scaleX(0);
        transform-origin: left;
        transition: 0.4s;
      }

      .card:hover::before {
        transform: scaleX(1);
      }

      .grid-3 {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 18px;
      }

      .grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }

      .pill {
        display: inline-block;
        background: #0f172a;
        border: 1px solid #334155;
        padding: 6px 12px;
        border-radius: 999px;
        font-size: 13px;
        margin: 4px 4px 0 0;
        transition: 0.25s;
      }

      .pill:hover {
        background: var(--accent);
        color: #fff;
        transform: scale(1.08) rotate(-1deg);
      }

      .tag {
        font-size: 11px;
        background: #0ea5e9;
        color: #fff;
        padding: 4px 9px;
        border-radius: 999px;
        font-weight: 600;
      }

      .dark-tag {
        background: #334155;
      }

      .muted {
        color: var(--muted);
        font-size: 14px;
      }

      .small {
        font-size: 13px;
        color: var(--muted);
      }

      .card-heading {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--accent);
        margin-bottom: 8px;
      }

      .skill-bar {
        height: 8px;
        background: #0f172a;
        border-radius: 999px;
        overflow: hidden;
        margin: 8px 0 14px;
      }

      .skill-fill {
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--accent), var(--accent2));
        transition: width 1.2s ease;
      }

      .skill-label {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        margin-top: 10px;
      }

      .pill-row {
        margin-top: 12px;
      }

      .project-img {
        height: 170px;
        border-radius: 12px;
        background: linear-gradient(135deg, #0ea5e9, #6366f1, #a855f7, #ec4899);
        background-size: 300% 300%;
        animation: gradientMove 5s linear infinite;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 52px;
        position: relative;
        overflow: hidden;
        margin-bottom: 16px;
      }

      .project-img::after {
        content: "";
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: linear-gradient(
          120deg,
          transparent 40%,
          rgba(255, 255, 255, 0.3) 50%,
          transparent 60%
        );
        animation: shine 3s infinite;
      }

      @keyframes shine {
        0% {
          transform: translateX(-100%);
        }

        100% {
          transform: translateX(100%);
        }
      }

      .project-img span {
        animation: spinSat 4s ease-in-out infinite;
        display: inline-block;
        z-index: 1;
      }

      @keyframes spinSat {
        0%,
        100% {
          transform: rotate(-8deg) translateY(0);
        }

        50% {
          transform: rotate(8deg) translateY(-8px);
        }
      }

      .project-card {
        transition: 0.4s;
      }

      .project-card:hover {
        transform: translateY(-8px) rotate(-0.5deg) scale(1.01);
      }

      .project-desc {
        margin: 8px 0 14px;
      }

      .tag-row {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }

      .project-link {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        color: var(--accent);
        font-weight: 600;
        margin-top: 16px;
      }

      .cert-list {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }

      .cert {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }

      .cert b {
        display: block;
        margin: 4px 0;
      }

      .cert a {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        color: var(--accent);
        font-size: 13px;
        font-weight: 600;
        margin-top: 10px;
      }

      .cert:hover .cert-icon {
        transform: rotate(360deg) scale(1.2);
      }

      .cert-icon {
        font-size: 26px;
        display: inline-block;
        transition: 0.6s;
        margin-bottom: 8px;
      }

      .marquee {
        overflow: hidden;
        white-space: nowrap;
        background: #1e293b;
        border-block: 1px solid #334155;
        padding: 12px 0;
        margin: 10px 0;
        position: relative;
        z-index: 1;
      }

      .marquee-inner {
        display: inline-block;
        animation: marquee 18s linear infinite;
      }

      .marquee-inner span {
        margin: 0 22px;
        font-weight: 600;
        color: var(--muted);
        font-size: 14px;
      }

      .marquee-inner span b {
        color: var(--accent);
      }

      @keyframes marquee {
        from {
          transform: translateX(0);
        }

        to {
          transform: translateX(-50%);
        }
      }

      .mt {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-top: 12px;
      }

      .accent-text {
        color: var(--accent);
        font-weight: 600;
        margin: 8px 0;
      }

      .white {
        color: #fff;
      }

      input,
      textarea {
        width: 100%;
        padding: 12px 14px;
        background: #0f172a;
        border: 1px solid #334155;
        border-radius: 10px;
        color: #fff;
        margin-bottom: 12px;
        font-family: inherit;
        transition: 0.25s;
      }

      input:focus,
      textarea:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        transform: scale(1.01);
      }

      .contact-lines {
        display: flex;
        flex-direction: column;
        gap: 11px;
        margin: 16px 0;
      }

      .contact-lines a,
      .contact-lines p {
        display: flex;
        gap: 10px;
        align-items: center;
        color: var(--muted);
      }

      .form-title {
        margin-bottom: 14px;
      }

      .full-btn {
        border: none;
        width: 100%;
      }

      .form-status {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        color: #a7f3d0;
        background: #052e22;
        border: 1px solid #14532d;
        border-radius: 10px;
        padding: 11px 12px;
        margin-top: 12px;
        font-size: 14px;
      }

      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
      }

      footer {
        border-top: 1px solid #1e293b;
        padding: 28px 0;
        text-align: center;
        color: var(--muted);
        font-size: 14px;
        position: relative;
        z-index: 1;
      }

      .award-note {
        display: flex;
        justify-content: center;
        gap: 7px;
        align-items: center;
        color: #64748b;
        font-size: 12px;
        padding: 0 20px 22px;
      }

      @media (max-width: 800px) {
        .hero-grid,
        .grid-3,
        .grid-2,
        .cert-list {
          grid-template-columns: 1fr;
        }

        .nav-links {
          display: none;
        }

        .hamburger {
          display: block;
        }

        .mobile-menu {
          display: flex;
        }

        .hero {
          padding-top: 42px;
        }

        .hero-btns .btn {
          flex: 1;
        }

        .stats {
          grid-template-columns: repeat(3, 1fr);
        }
      }

      @media (max-width: 480px) {
        .stats {
          grid-template-columns: 1fr;
        }

        .hero-btns {
          flex-direction: column;
        }

        .hero-btns .btn {
          width: 100%;
        }
      }
